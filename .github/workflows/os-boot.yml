name: OS boot smoke test

# Builds the ClarityOS kernel and boots it headlessly under QEMU, asserting
# the kernel reaches its "ClarityOS ready." serial marker.
#
# Scope is deliberately the KERNEL, not the whole userspace: the kernel
# prints the marker before it spawns the (still-in-progress freestanding)
# runtime, so a minimal GRUB rescue ISO carrying just the kernel is the
# right, self-contained way to verify boot. GitHub runners have no
# /dev/kvm, so QEMU runs under TCG — hence the generous timeout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  os-boot:
    runs-on: ubuntu-latest
    name: OS boot (linux-x64, TCG)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install QEMU + GRUB rescue tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools
          qemu-system-x86_64 --version | head -1
          zig version

      - name: Build the kernel
        run: |
          cd kernel
          zig build
          test -f zig-out/bin/clarity-kernel

      - name: Assemble a minimal GRUB rescue ISO (kernel only)
        run: |
          mkdir -p isodir/boot/grub
          cp kernel/zig-out/bin/clarity-kernel isodir/boot/clarity-kernel
          cat > isodir/boot/grub/grub.cfg <<'CFG'
          set timeout=0
          set default=0
          menuentry "ClarityOS" {
              multiboot2 /boot/clarity-kernel
              boot
          }
          CFG
          grub-mkrescue -o clarity-kernel.iso isodir
          test -f clarity-kernel.iso

      - name: Boot the kernel under QEMU and assert the ready marker
        run: |
          # Boot the SAME image three times. A kernel that only sometimes
          # reaches userspace is a real defect, so the gate requires every
          # attempt to succeed rather than just one.
          # -no-reboot: halt instead of looping if the kernel faults after the
          # marker (it will try to spawn a runtime that isn't in this ISO).
          fails=0
          for attempt in 1 2 3; do
            echo "=== boot attempt $attempt ==="
            timeout 180 qemu-system-x86_64 \
              -cdrom clarity-kernel.iso \
              -boot d \
              -m 512 \
              -serial stdio \
              -display none \
              -no-reboot \
              > "serial-$attempt.log" 2>&1 || true
            cat "serial-$attempt.log"
            if grep -q "ClarityOS ready." "serial-$attempt.log"; then
              echo "--> attempt $attempt: PASS"
            else
              echo "--> attempt $attempt: FAIL (never reached the ready marker)"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -ne 0 ]; then
            echo "FAIL: $fails of 3 boots did not reach 'ClarityOS ready.'"
            exit 1
          fi
          echo "PASS: kernel reached the ready marker on all 3 boots"

  os-boot-aarch64:
    runs-on: ubuntu-latest
    name: OS boot (aarch64, TCG)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install QEMU (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version | head -1
          zig version

      - name: Build the aarch64 kernel
        run: |
          cd kernel
          zig build aarch64
          test -f zig-out/bin/clarity-kernel-aarch64

      - name: Boot the aarch64 kernel under QEMU and assert the marker
        run: |
          echo "Booting ClarityOS aarch64 (QEMU virt, TCG)..."
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 512 \
            -kernel kernel/zig-out/bin/clarity-kernel-aarch64 \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-arm.log 2>&1 || true
          echo "----- serial output -----"
          cat serial-arm.log
          echo "-------------------------"
          if grep -q "ClarityOS aarch64: EL1 boot ok" serial-arm.log; then
            echo "PASS: aarch64 kernel reached EL1 and brought up the UART"
          else
            echo "FAIL: aarch64 boot marker never appeared on serial"
            exit 1
          fi
