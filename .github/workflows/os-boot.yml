name: OS boot smoke test

# Builds the ClarityOS kernel and boots it headlessly under QEMU, asserting
# the kernel reaches its "ClarityOS ready." serial marker.
#
# Scope is deliberately the KERNEL, not the whole userspace: the kernel
# prints the marker before it spawns the (still-in-progress freestanding)
# runtime, so a minimal GRUB rescue ISO carrying just the kernel is the
# right, self-contained way to verify boot. GitHub runners have no
# /dev/kvm, so QEMU runs under TCG — hence the generous timeout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  os-boot:
    runs-on: ubuntu-latest
    name: OS boot (linux-x64, TCG)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install QEMU + GRUB rescue tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools
          qemu-system-x86_64 --version | head -1
          zig version

      - name: Build the kernel
        run: |
          cd kernel
          zig build
          test -f zig-out/bin/clarity-kernel

      - name: Assemble a minimal GRUB rescue ISO (kernel only)
        run: |
          mkdir -p isodir/boot/grub
          cp kernel/zig-out/bin/clarity-kernel isodir/boot/clarity-kernel
          cat > isodir/boot/grub/grub.cfg <<'CFG'
          set timeout=0
          set default=0
          menuentry "ClarityOS" {
              multiboot2 /boot/clarity-kernel
              boot
          }
          CFG
          grub-mkrescue -o clarity-kernel.iso isodir
          test -f clarity-kernel.iso

      - name: Boot the kernel under QEMU and assert the ready marker
        run: |
          # Boot the SAME image three times. A kernel that only sometimes
          # reaches userspace is a real defect, so the gate requires every
          # attempt to succeed rather than just one.
          #
          # Three markers, each proving a further step:
          #   "ClarityOS ready."         -- the kernel finished initialising
          #   "[ok] context switch"      -- two kernel threads ran, and
          #   "[A] round 1"                 thread A resumed *inside* the
          #                                 yield it called rather than at its
          #                                 entry point, which is the half of
          #                                 a context switch that is easy to
          #                                 get wrong
          #   "[ok] preemption"          -- the timer took the CPU away from a
          #                                 thread that never yielded, and gave
          #                                 it back; cooperative scheduling
          #                                 cannot produce this line
          #   "[ok] vfs"                 -- a path resolved: a file was created,
          #                                 written, and read back by name
          #   "[ok] user .bss zeroed"    -- the loader zero-filled the part of
          #                                 the last page that has no file
          #                                 behind it, which one hand-made
          #                                 segment could never have shown
          #   "[ok] user heap"           -- brk grew the process's heap and
          #                                 the pages it mapped are really
          #                                 there: the program writes through
          #                                 the new break and reads it back
          #   "hello from /bin/..."      -- an ELF was read out of the
          #                                 filesystem, parsed, mapped into a
          #                                 fresh address space, and run at
          #                                 CPL 3, and its `syscall` reached
          #                                 the kernel with the arguments the
          #                                 program passed
          #   "[exit] status=0"          -- SYSRET returned to ring 3 and a
          #                                 *second* syscall arrived, which is
          #                                 the only evidence that the return
          #                                 path works at all
          # -no-reboot: halt instead of looping if the kernel faults.
          fails=0
          for attempt in 1 2 3; do
            echo "=== boot attempt $attempt ==="
            timeout 45 qemu-system-x86_64 \
              -cdrom clarity-kernel.iso \
              -boot d \
              -m 512 \
              -serial stdio \
              -display none \
              -no-reboot \
              > "serial-$attempt.log" 2>&1 || true
            cat "serial-$attempt.log"
            missing=""
            grep -q "ClarityOS ready." "serial-$attempt.log" || missing="$missing ready"
            grep -q "\[ok\] context switch" "serial-$attempt.log" || missing="$missing ctxswitch"
            grep -q "\[A\] round 1" "serial-$attempt.log" || missing="$missing thread-resumed"
            grep -q "\[ok\] preemption" "serial-$attempt.log" || missing="$missing preemption"
            grep -q "\[ok\] vfs" "serial-$attempt.log" || missing="$missing vfs"
            grep -q "hello from /bin/clarity-init" "serial-$attempt.log" || missing="$missing init-process"
            grep -q "\[ok\] user .bss zeroed" "serial-$attempt.log" || missing="$missing user-bss"
            grep -q "\[ok\] user heap" "serial-$attempt.log" || missing="$missing user-heap"
            grep -q "\[exit\] status=0" "serial-$attempt.log" || missing="$missing sysret-return"
            if [ -z "$missing" ]; then
              echo "--> attempt $attempt: PASS"
            else
              echo "--> attempt $attempt: FAIL (missing:$missing)"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -ne 0 ]; then
            echo "FAIL: $fails of 3 boots did not reach userspace and back"
            exit 1
          fi
          echo "PASS: all 3 boots entered ring 3, took a syscall, and returned"

  os-boot-aarch64:
    runs-on: ubuntu-latest
    name: OS boot (aarch64, TCG)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install QEMU (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version | head -1
          zig version

      - name: Build the aarch64 kernel
        run: |
          cd kernel
          zig build aarch64
          test -f zig-out/bin/clarity-kernel-aarch64

      - name: Boot the aarch64 kernel under QEMU and assert the marker
        run: |
          echo "Booting ClarityOS aarch64 (QEMU virt, TCG)..."
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 512 \
            -kernel kernel/zig-out/bin/clarity-kernel-aarch64 \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-arm.log 2>&1 || true
          echo "----- serial output -----"
          cat serial-arm.log
          echo "-------------------------"
          # Two markers. The boot marker says the kernel reached EL1 with the
          # MMU on; the timer one says an interrupt was actually delivered —
          # the vectors had been installed since the ARM kernel first booted
          # and nothing had ever reached them.
          if grep -q "ClarityOS aarch64: EL1 boot ok" serial-arm.log \
             && grep -q "\[ok\] aarch64 timer: interrupts delivered" serial-arm.log; then
            echo "PASS: aarch64 reached EL1, MMU on, and took a timer interrupt"
          else
            echo "FAIL: aarch64 did not reach EL1, or no timer interrupt arrived"
            exit 1
          fi
